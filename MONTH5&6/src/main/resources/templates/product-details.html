<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Product Details</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            margin: 0;
        }

        .navbar {
            background: #131921;
            color: white;
            padding: 15px;
            font-size: 22px;
        }

        .content {
            padding: 30px;
            display: flex;
            gap: 30px;
            background: white;
            margin: 20px;
        }

        img {
            width: 300px;
            height: 300px;
            object-fit: cover;
            background: #eee;
        }

        .details h2 {
            margin-top: 0;
        }

        table {
            margin-top: 15px;
            border-collapse: collapse;
        }

        td {
            padding: 8px 15px;
            border-bottom: 1px solid #ddd;
        }

        /* ❤️ Wishlist button */
        .wishlist-btn {
            margin-top: 20px;
            padding: 10px 18px;
            font-size: 16px;
            border: none;
            cursor: pointer;
            background: #ff5252;
            color: white;
            border-radius: 4px;
        }

        .wishlist-btn.added {
            background: green;
        }
    </style>
</head>

<body>

<div class="navbar">My E-Commerce Store</div>

<div class="content">

    <img th:src="@{${product.image}}">

    <div class="details">
        <h2 th:text="${product.name}"></h2>
        <h3>₹ <span th:text="${product.price}"></span></h3>

        <table>
            <tr>
                <td>Color</td>
                <td th:text="${product.color}"></td>
            </tr>
            <tr>
                <td>RAM</td>
                <td th:text="${product.ram}"></td>
            </tr>
            <tr>
                <td>Storage</td>
                <td th:text="${product.storage}"></td>
            </tr>
            <tr>
                <td>Battery</td>
                <td th:text="${product.battery}"></td>
            </tr>
        </table>

        <!-- ❤️ ADD TO WISHLIST -->
        <form th:action="@{/products/wishlist/{id}(id=${product.id})}"
              method="post">

            <button type="submit"
                    class="wishlist-btn"
                    onclick="this.classList.add('added')">
                ❤️ Add to Wishlist
            </button>
        </form>

        <br>
        <a href="/products">⬅ Back to products</a>
    </div>

</div>

</body>
</html>
