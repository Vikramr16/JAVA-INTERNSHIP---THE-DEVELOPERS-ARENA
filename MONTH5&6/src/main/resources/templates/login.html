<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            /* LIGHT ANIMATED BACKGROUND */
            background: linear-gradient(-45deg, #a8edea, #fed6e3, #fef9a7, #c1ffd7);
            background-size: 400% 400%;
            animation: bgMove 12s ease infinite;

            font-family: Arial, sans-serif;
        }

        @keyframes bgMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .login-box {
            width: 340px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.85);
            border: 2px solid #00bcd4;
            border-radius: 18px;
            box-shadow: 0 0 22px #00bcd4;
            text-align: center;
            animation: glow 2s infinite alternate ease-in-out;
        }

        @keyframes glow {
            from { box-shadow: 0 0 12px #00bcd4; }
            to   { box-shadow: 0 0 32px #00e0ff; }
        }

        .login-box h2 {
            color: #00bcd4;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 12px 0;
            border: none;
            border-bottom: 2px solid #00bcd4;
            background: transparent;
            color: #333;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        input::placeholder {
            color: #666;
        }

        input:focus {
            border-bottom-color: #33e4ff;
            box-shadow: 0 0 10px #00bcd4;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 18px;
            border: none;
            background: #00bcd4;
            color: white;
            font-size: 17px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 0 22px #00bcd4;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px #00e0ff;
        }

        a {
            display: block;
            margin-top: 15px;
            color: #007c91;
            text-decoration: none;
            font-size: 14px;
        }

        a:hover {
            text-shadow: 0 0 5px #00bcd4;
        }

        .error {
            color: #ff6666;
            margin-top: 10px;
        }
    </style>

</head>
<body>

<div class="login-box">
    <h2>LOGIN</h2>

    <form action="/login" method="post">
        <input type="text" name="username" placeholder="Enter Username" required>

        <input type="password" name="password" placeholder="Enter Password" required>

        <button type="submit">Login</button>
    </form>

    <a href="/signup">Don't have an account? Signup</a>

    <p th:if="${loginError}" class="error" th:text="${loginError}"></p>
</div>

</body>
</html>
