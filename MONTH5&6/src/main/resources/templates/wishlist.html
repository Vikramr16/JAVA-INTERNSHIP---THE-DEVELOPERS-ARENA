<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Wishlist</title>
</head>
<body>

<h2>❤️ My Wishlist</h2>

<div th:each="w : ${wishlist}">
    <p th:text="${w.product.name}"></p>
    <p>₹<span th:text="${w.product.price}"></span></p>

    <a th:href="@{/products/{id}(id=${w.product.id})}">
        View Product
    </a>
</div>

<a href="/products">Back to Products</a>

</body>
</html>
